<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#18002e">
    <title>Madonna Inn EP — Psychedelic Field</title>
    <link rel="stylesheet" href="/webgl/styles.css">
    <style>
        .transmission {
            position: fixed; z-index: 2; left: max(1.2rem, env(safe-area-inset-left));
            bottom: max(1.2rem, env(safe-area-inset-bottom));
            width: min(24rem, calc(100vw - 2.4rem)); padding: 1.2rem 1.35rem;
            color: #fff4d3; background: rgba(30, 3, 43, .86);
            border: 1px solid rgba(255, 222, 126, .55); border-radius: 1.1rem;
            box-shadow: 0 10px 50px rgba(22, 0, 35, .42);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            font-family: Georgia, "Times New Roman", serif;
        }
        .transmission .eyebrow {
            margin: 0 0 .45rem; font: 600 .65rem/1.2 system-ui, sans-serif;
            letter-spacing: .22em; text-transform: uppercase; color: #ffc35c;
        }
        .transmission h1 {
            margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: .98;
            font-weight: 400; letter-spacing: -.04em; font-style: italic;
        }
        .transmission .note { margin: .6rem 0 .85rem; font: .78rem/1.5 system-ui, sans-serif; color: #f4d8bf; }
        .transmission audio { display: block; width: 100%; height: 40px; }
        .transmission a { display: inline-block; margin-top: .75rem; color: #ffdb83; font: 600 .7rem/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-underline-offset: .25em; }
        .transmission a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
        @media (max-height: 420px) {
            .transmission { padding: .75rem 1rem; }
            .transmission h1 { font-size: 1.5rem; }
            .transmission .note { margin: .3rem 0; }
        }
    </style>
</head>
<body>
    <canvas id="gl-canvas" aria-label="Animated psychedelic concentric color field"></canvas>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="transmission" aria-labelledby="track-title">
        <p class="eyebrow">Soundbit · Field transmission</p>
        <h1 id="track-title">Madonna Inn EP</h1>
        <p class="note">The porch of the Sky Room · recorded live 10.10.2026 · mixed at Tomahawk</p>
